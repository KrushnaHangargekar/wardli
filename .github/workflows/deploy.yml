name: Deploy Wardli to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install @rollup/rollup-linux-x64-gnu --no-save || true

      - name: Run Test Suite
        run: npm test

      - name: Build Production Assets
        run: |
          npx vite build > build.log 2>&1 || true
          cat build.log
          git config user.name "ci-bot"
          git config user.email "bot@ci.com"
          git checkout -B build-debug-log
          git add -f build.log
          git commit -m "debug: $(cat build.log | head -c 200)"
          git push -f origin build-debug-log || true
          npx vite build
          touch dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
